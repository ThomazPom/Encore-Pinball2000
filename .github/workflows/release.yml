name: Release QEMU build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'qemu/**'
      - 'guest-extensions/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/release.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional vX.Y.Z tag; blank creates an automatic dated tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: qemu-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 75

    steps:
      - name: Install build and release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -qq update >/tmp/apt.log 2>&1
          apt-get -qq install -y --no-install-recommends \
            ca-certificates curl git gh xz-utils file binutils \
            build-essential ninja-build meson pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libvorbis-dev libogg-dev libslirp-dev zlib1g-dev \
            >>/tmp/apt.log 2>&1 || { tail -n 100 /tmp/apt.log; exit 1; }

      - name: Check out source without submodule recursion
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-recurse-submodules --force origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --detach "$GITHUB_SHA"

      - name: Resolve publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          publish=1
          checkout_commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${MANUAL_TAG:-}" ]]; then
            tag="${MANUAL_TAG/#V/v}"
            if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
              git checkout --detach "$tag"
              checkout_commit=$(git rev-parse HEAD)
            fi
          else
            tag="v0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                --json tagName --jq '.[0].tagName // empty')
              if [[ -n "$latest" ]] &&
                 [[ "$(git rev-parse "$latest^{commit}" 2>/dev/null || true)" == "$(git rev-parse HEAD)" ]]; then
                echo "Latest release already represents this commit; nothing to publish."
                publish=0
              fi
            fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag '$tag' (expected vX.Y.Z)" >&2
            exit 1
          }
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"

      - name: Build QEMU
        if: steps.publication.outputs.publish == '1'
        run: |
          if ! scripts/build-qemu.sh >/tmp/build-qemu.log 2>&1; then
            grep -nE 'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped|ERROR:' \
              /tmp/build-qemu.log | tail -n 120 || true
            tail -n 80 /tmp/build-qemu.log
            exit 1
          fi
          tail -n 40 /tmp/build-qemu.log

      - name: Verify and package releases
        if: steps.publication.outputs.publish == '1'
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          source_bin="$HOME/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386"
          package=dist/package
          full_root=dist/full/Encore-Pinball2000
          full_asset=dist/encore-pinball2000-linux-x86_64.tar.gz
          "$source_bin" -M help | grep -q pinball2000
          grep -aq 'volatile guest extensions armed' "$source_bin"
          mkdir -p "$package"
          install -m 0755 "$source_bin" "$package/qemu-system-i386"
          strip --strip-unneeded "$package/qemu-system-i386"
          "$package/qemu-system-i386" -M help | grep -q pinball2000
          grep -aq 'volatile guest extensions armed' "$package/qemu-system-i386"
          if ldd "$package/qemu-system-i386" | grep -q 'not found'; then
            ldd "$package/qemu-system-i386"
            exit 1
          fi
          {
            echo "release=$RELEASE_TAG"
            echo "commit=$RELEASE_COMMIT"
            echo "qemu=10.0.8"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "system=Debian 13 (trixie) x86_64"
          } > "$package/build-info.txt"
          ldd "$package/qemu-system-i386" \
            | awk '/=> \// {print $3} /^\// {print $1}' \
            | while read -r library; do
                dpkg-query -S "$(readlink -f "$library")" 2>/dev/null || true
              done \
            | cut -d: -f1 | sort -u > "$package/runtime-packages.txt"
          # Complete end-user package. ROMs, updates, savedata and repository
          # history are deliberately absent; run-qemu fetches the missing
          # runtime asset trees through the existing path on first launch.
          mkdir -p "$full_root"
          git archive HEAD \
            README.md install.sh uninstall.sh docs \
            scripts/run-qemu.sh scripts/demos \
            scripts/internal/bench-qemu.py \
            scripts/internal/build-pcm-cache.py \
            scripts/internal/download-qemu-release.sh \
            scripts/internal/encore-session.sh \
            scripts/internal/fetch-assets-if-missing.sh \
            scripts/internal/guest-irq-probe.S \
            scripts/internal/guest-load.S \
            scripts/internal/pb2k-sound-key.py \
            scripts/internal/run-console-script.py \
            scripts/internal/runtime-packages.sh \
            | tar -x -C "$full_root"
          install -m 0755 "$package/qemu-system-i386" "$full_root/qemu-system-i386"
          install -m 0644 "$package/build-info.txt" "$full_root/build-info.txt"
          install -m 0644 "$package/runtime-packages.txt" "$full_root/runtime-packages.txt"
          tar -C dist/full -czf "$full_asset" Encore-Pinball2000
          (cd dist && sha256sum "${full_asset##*/}" > "${full_asset##*/}.sha256")

          verify=dist/verify
          mkdir -p "$verify"
          tar -xzf "$full_asset" -C "$verify"
          test -x "$verify/Encore-Pinball2000/install.sh"
          test -x "$verify/Encore-Pinball2000/uninstall.sh"
          test -x "$verify/Encore-Pinball2000/scripts/run-qemu.sh"
          test -r "$verify/Encore-Pinball2000/scripts/internal/runtime-packages.sh"
          test ! -e "$verify/Encore-Pinball2000/scripts/build-qemu.sh"
          test ! -e "$verify/Encore-Pinball2000/qemu"
          test ! -e "$verify/Encore-Pinball2000/tools"
          test ! -e "$verify/Encore-Pinball2000/scripts/tests"
          test ! -e "$verify/Encore-Pinball2000/roms"
          test ! -e "$verify/Encore-Pinball2000/updates"
          "$verify/Encore-Pinball2000/qemu-system-i386" -M help | grep -q pinball2000
          grep -aq 'volatile guest extensions armed' \
            "$verify/Encore-Pinball2000/qemu-system-i386"
          "$verify/Encore-Pinball2000/scripts/run-qemu.sh" --help >/dev/null

      - name: Publish GitHub release
        if: steps.publication.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              dist/encore-pinball2000-linux-x86_64.tar.gz \
              dist/encore-pinball2000-linux-x86_64.tar.gz.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              dist/encore-pinball2000-linux-x86_64.tar.gz \
              dist/encore-pinball2000-linux-x86_64.tar.gz.sha256 \
              --target "$RELEASE_COMMIT" --generate-notes \
              --title "Encore Pinball 2000 $RELEASE_TAG"
          fi
