name: Temporary switch-keymap container build

on:
  push:
    branches:
      - feature/yaml-switch-keymap

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils \
            build-essential ninja-build meson pkg-config python3 \
            libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libvorbis-dev libogg-dev libgtk-3-dev zlib1g-dev

      - uses: actions/checkout@v4

      - name: Build QEMU
        run: scripts/build-qemu.sh

      - name: Verify machine registration
        run: |
          BIN="$HOME/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386"
          "$BIN" -M help | tee /tmp/machines.txt
          grep -q pinball2000 /tmp/machines.txt

      - name: Upload binary and verification output
        uses: actions/upload-artifact@v4
        with:
          name: qemu-switch-keymap-build
          path: |
            /github/home/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386
            /tmp/machines.txt
          if-no-files-found: error
