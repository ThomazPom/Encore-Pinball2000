name: QEMU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60

    steps:
      - name: Bootstrap source checkout
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -qq update >/tmp/apt.log 2>&1
          apt-get -qq install -y --no-install-recommends \
            ca-certificates git \
            >>/tmp/apt.log 2>&1 || { tail -n 80 /tmp/apt.log; exit 1; }

      - name: Check out source without submodule recursion
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-recurse-submodules --force origin "$GITHUB_REF"
          git checkout --detach "$GITHUB_SHA"

      - name: Install declared build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          source scripts/dependencies.sh
          apt-get -qq install -y --no-install-recommends \
            "${ENCORE_APT_QEMU_BUILD[@]}" \
            >>/tmp/apt.log 2>&1 || { tail -n 80 /tmp/apt.log; exit 1; }

      - name: Build QEMU
        run: |
          if ! bash scripts/build-qemu.sh >/tmp/build-qemu.log 2>&1; then
            echo "QEMU build failed. Relevant compiler output:"
            grep -nE 'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped|meson.build|ERROR:' \
              /tmp/build-qemu.log | tail -n 100 || true
            echo "Last 60 build lines:"
            tail -n 60 /tmp/build-qemu.log
            exit 1
          fi
          tail -n 30 /tmp/build-qemu.log

      - name: Verify pinball2000 machine registration
        run: |
          BIN="$HOME/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386"
          "$BIN" -M help | tee /tmp/qemu-machines.txt
          grep -q pinball2000 /tmp/qemu-machines.txt
