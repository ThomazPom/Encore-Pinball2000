name: QEMU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -qq update >/tmp/apt.log 2>&1
          apt-get -qq install -y --no-install-recommends \
            ca-certificates curl git xz-utils \
            build-essential ninja-build meson pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libvorbis-dev libogg-dev libslirp-dev zlib1g-dev \
            >>/tmp/apt.log 2>&1 || { tail -n 80 /tmp/apt.log; exit 1; }

      - uses: actions/checkout@v6

      - name: Build QEMU
        run: |
          if ! bash scripts/build-qemu.sh >/tmp/build-qemu.log 2>&1; then
            echo "QEMU build failed. Relevant compiler output:"
            grep -nE 'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped|meson.build|ERROR:' \
              /tmp/build-qemu.log | tail -n 100 || true
            echo "Last 60 build lines:"
            tail -n 60 /tmp/build-qemu.log
            exit 1
          fi
          tail -n 30 /tmp/build-qemu.log

      - name: Verify pinball2000 machine registration
        run: |
          BIN="$HOME/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386"
          "$BIN" -M help | tee /tmp/qemu-machines.txt
          grep -q pinball2000 /tmp/qemu-machines.txt
