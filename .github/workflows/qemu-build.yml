name: QEMU CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -qq update >/tmp/apt.log 2>&1
          apt-get -qq install -y --no-install-recommends \
            ca-certificates curl git xz-utils \
            build-essential ninja-build meson pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libvorbis-dev libogg-dev libslirp-dev zlib1g-dev \
            >>/tmp/apt.log 2>&1 || { tail -n 80 /tmp/apt.log; exit 1; }

      - name: Check out source without submodule recursion
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-recurse-submodules --force origin "$GITHUB_REF"
          git checkout --detach "$GITHUB_SHA"

      - name: Validate repository tooling
        run: |
          bash -n install.sh uninstall.sh scripts/run-qemu.sh scripts/build-qemu.sh \
            scripts/internal/encore-session.sh scripts/internal/network-validation.sh \
            tools/capture-live-crash.sh \
            tools/debian-qemu/lab.sh
          ./install.sh --help >/dev/null
          ./uninstall.sh --help >/dev/null
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 guest-extensions/check-romset.py
          python3 -m py_compile \
            guest-extensions/check-romset.py \
            docs/measurements/dcs-engines/run-comparison.py \
            docs/measurements/validation-matrix/run-matrix.py

      - name: Build QEMU
        run: |
          if ! bash scripts/build-qemu.sh >/tmp/build-qemu.log 2>&1; then
            echo "QEMU build failed. Relevant compiler output:"
            grep -nE 'FAILED:|fatal error:|error:|undefined reference|ninja: build stopped|meson.build|ERROR:' \
              /tmp/build-qemu.log | tail -n 100 || true
            echo "Last 60 build lines:"
            tail -n 60 /tmp/build-qemu.log
            exit 1
          fi
          tail -n 30 /tmp/build-qemu.log

      - name: Verify pinball2000 machine registration
        run: |
          BIN="$HOME/.cache/p2k-qemu-build/qemu-10.0.8/build/qemu-system-i386"
          "$BIN" -M help | tee /tmp/qemu-machines.txt
          grep -q pinball2000 /tmp/qemu-machines.txt

      - name: Boot and exercise cabinet key routing
        run: python3 scripts/tests/smoke-switch-keymap.py
