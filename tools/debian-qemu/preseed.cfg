### Encore Pinball 2000: deliberately stripped Debian 13 test guest.
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect @HOST_LOCALE@
d-i keyboard-configuration/xkb-keymap select @HOST_KEYMAP@
d-i keyboard-configuration/layoutcode string @HOST_LAYOUT@
d-i keyboard-configuration/variantcode string @HOST_VARIANT@
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string encore-netinst
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean true
d-i passwd/root-password password cabinet
d-i passwd/root-password-again password cabinet
d-i passwd/user-fullname string Cabinet Test User
d-i passwd/username string cabinet
d-i passwd/user-password password cabinet
d-i passwd/user-password-again password cabinet
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server ca-certificates git qemu-guest-agent
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string \
  in-target systemctl enable ssh qemu-guest-agent; \
  in-target sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
  sed -i '/^@HOST_LOCALE@ UTF-8$/d' /target/etc/locale.gen; \
  echo '@HOST_LOCALE@ UTF-8' >> /target/etc/locale.gen; \
  in-target locale-gen; \
  echo 'LANG=@HOST_LOCALE@' > /target/etc/default/locale; \
  sed -i 's/^XKBLAYOUT=.*/XKBLAYOUT="@HOST_LAYOUT@"/; s/^XKBVARIANT=.*/XKBVARIANT="@HOST_VARIANT@"/' /target/etc/default/keyboard; \
  in-target sed -i 's/^GRUB_CMDLINE_LINUX=.*/GRUB_CMDLINE_LINUX="console=tty0 console=ttyS0,115200n8 systemd.ssh_auto=no"/' /etc/default/grub; \
  in-target update-grub
